[project]
name = "studio-north-monthly-replay"
version = "1.0.0"
description = "Month-by-month replay dashboard of the Studio North customer-economics report (FAQ 4)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact versions used by the guided run of customer-economics-lab 0e40ce3 (its uv.lock),
# so as-of refits reproduce the report's posterior draws bit for bit.
dependencies = [
  "duckdb==2.0.0",
  "numpy==2.5.4",
  "pandas==2.3.3",
  "scipy==1.18.1",
  "jax[cpu]==0.12.0.1",
  "jaxlib==0.12.0.1",
  "numpyro==0.22.0",
]

[tool.uv]
package = false
